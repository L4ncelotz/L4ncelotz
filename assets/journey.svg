<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59d9ff"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff6b9d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="190" rx="24" fill="#0d1117" stroke="#30363d"/>
  <text x="42" y="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#f6f8fa">the path so far</text>
  <text x="42" y="67" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8b949e">from learning syntax → building systems</text>

  <line x1="90" y1="115" x2="1110" y2="115" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle cx="120" cy="115" r="9" fill="#59d9ff"/>
    <text x="120" y="102" text-anchor="middle" font-size="12" fill="#8b949e">2023</text>
    <text x="120" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#f6f8fa">fundamentals</text>

    <circle cx="365" cy="115" r="9" fill="#69c8ff"/>
    <text x="365" y="102" text-anchor="middle" font-size="12" fill="#8b949e">2024</text>
    <text x="365" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#f6f8fa">frontend</text>

    <circle cx="610" cy="115" r="9" fill="#a78bfa"/>
    <text x="610" y="102" text-anchor="middle" font-size="12" fill="#8b949e">2025</text>
    <text x="610" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#f6f8fa">full-stack</text>

    <circle cx="855" cy="115" r="9" fill="#e17bb0"/>
    <text x="855" y="102" text-anchor="middle" font-size="12" fill="#8b949e">2026</text>
    <text x="855" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#f6f8fa">tooling · systems</text>

    <circle cx="1080" cy="115" r="12" fill="#ff6b9d"/>
    <circle cx="1080" cy="115" r="20" fill="none" stroke="#ff6b9d" stroke-opacity=".25"/>
    <text x="1080" y="102" text-anchor="middle" font-size="12" fill="#8b949e">next</text>
    <text x="1080" y="145" text-anchor="middle" font-size="14" font-weight="700" fill="#f6f8fa">cloud · devops</text>
